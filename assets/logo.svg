<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#logoGrad)" filter="url(#logoShadow)" />
  <!-- Laptop Screen Lid -->
  <rect x="22" y="24" width="56" height="38" rx="5" fill="#ffffff" />
  <rect x="26" y="28" width="48" height="30" rx="3" fill="#0f172a" />
  <!-- Screen Accent / Logo -->
  <path d="M 46 38 L 54 38 L 48 45 L 53 45 L 45 54 L 48 47 L 44 47 Z" fill="#38bdf8" />
  <!-- Laptop Base / Keyboard -->
  <rect x="16" y="63" width="68" height="8" rx="4" fill="#ffffff" />
  <rect x="42" y="64" width="16" height="2.5" rx="1.25" fill="#94a3b8" />
</svg>
